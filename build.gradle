plugins { id 'fabric-loom' version '1.8.13' }
group = 'com.mythbound'
version = '0.2.0'
base { archivesName = 'mythbound-pause' }
repositories { mavenCentral(); maven { url 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.17.2'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
